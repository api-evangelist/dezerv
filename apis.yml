aid: dezerv
name: Dezerv
description: >-
  Dezerv (Dezerv Investments Private Limited) is an Indian wealth-management
  platform building a house of investment solutions for affluent Indians. It
  offers discretionary Portfolio Management Services (PMS), curated mutual-fund
  portfolios, bonds, an Investment Portfolio Analyser (IPA), a Wealth Monitor
  for tracking held-away assets, and ESOP financing, alongside a research-led
  investment philosophy and a weekly money newsletter. Dezerv is a SEBI-registered
  Portfolio Manager (INP000007377) and Investment Manager to a Category-I AIF /
  Angel Fund; mutual-fund distribution is via its AMFI-registered subsidiary.
  The company is client-facing (client.dezerv.in portal) and does not publish a
  public developer API surface. This API Evangelist profile enriches the company
  identity, links, and security posture rather than an API.
